name: Maven Tests (Java 21)

on:
  push:
    branches:
      - feature/desafio-backend-java-seplag
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compilar e executar testes
        run: mvn --batch-mode --no-transfer-progress clean test
