server:
  port: 8080
spring:
  application:
    name: backend-seplag
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/seplag}
    username: ${DB_USER:seplag}
    password: ${DB_PASSWORD:seplag_local}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health
app:
  origin: ${APP_ORIGIN:http://localhost:3000}
  service-origin: ${APP_SERVICE_ORIGIN:http://localhost:8080}
  security:
    user: ${APP_AUTH_USER:admin}
    password: ${APP_AUTH_PASSWORD:}
    jwt-secret: ${APP_JWT_SECRET:}
  minio:
    url: ${MINIO_URL:http://localhost:9000}
    public-url: ${MINIO_PUBLIC_URL:http://localhost:9000}
    access-key: ${MINIO_ROOT_USER:minioadmin}
    secret-key: ${MINIO_ROOT_PASSWORD:minioadmin}
    bucket: ${MINIO_BUCKET:capas}
  regionais-url: ${REGIONAIS_URL:https://integrador-argus-api.geia.vip/v1/regionais}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
