services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: seplag
      POSTGRES_USER: seplag
      POSTGRES_PASSWORD: ${DB_PASSWORD:-seplag_local}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seplag -d seplag"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  api:
    build: .
    restart: on-failure
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      DB_URL: jdbc:postgresql://db:5432/seplag
      DB_USER: seplag
      DB_PASSWORD: ${DB_PASSWORD:-seplag_local}
      MINIO_URL: http://minio:9000
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://localhost:9000}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: capas
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      APP_SERVICE_ORIGIN: ${APP_SERVICE_ORIGIN:-http://localhost:8080}
      APP_AUTH_USER: ${APP_AUTH_USER:-admin}
      APP_AUTH_PASSWORD: ${APP_AUTH_PASSWORD:?Configure APP_AUTH_PASSWORD no arquivo .env}
      APP_JWT_SECRET: ${APP_JWT_SECRET:?Configure APP_JWT_SECRET (Base64 de no minimo 32 bytes)}
      REGIONAIS_URL: https://integrador-argus-api.geia.vip/v1/regionais

volumes:
  postgres_data:
  minio_data:

